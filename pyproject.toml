[project]
name = "evalsuite"
version = "0.1.0"
description = "LLM response evaluation framework: golden-set vs generated-set scoring with a pluggable judge and per-module criteria."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
deepeval = ["deepeval"]
claude = ["anthropic"]
openai = ["openai"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evalsuite*"]
